<body>
<h1>حساب تيك توك الرسمي</h1>
<h2>@112005ms5948</h2>
<p>اكتشف الفيديو الجديد من أسرار الروحانيات الكبرى</p>
<a href="https://vt.tiktok.com/ZSp5M3Gyt/">شاهد الفيديو على تيك توك</a>

<button id="shareVideo" onclick="shareVideo()"
style="background:#00c896;color:white;padding:15px;
border:0;border-radius:12px;margin-top:20px">
مشاركة الفيديو
</button>
<script>
async function shareVideo() {
 const url = "https://vt.tiktok.com/ZSp5M3Gyt/";
 if (navigator.share) {
   try {
     await navigator.share({title:"فيديو روحاني",url:url});
   } catch(e) {}
 } else {
   try {
     await navigator.clipboard.writeText(url);
     alert("تم نسخ رابط الفيديو");
   } catch(e) {
     prompt("انسخ رابط الفيديو:",url);
   }
 }
}
</script>


<section style="margin:30px auto;padding:20px;max-width:450px">
<h2>لوحة تجهيز الفيديو</h2>
<input id="videoInput" type="url"
placeholder="الصق رابط فيديو تيك توك"
style="width:90%;padding:15px;border-radius:10px">
<button type="button" onclick="prepareVideo()"
style="padding:15px;margin:15px;background:#00c896;color:white;border:0;border-radius:10px">
تجهيز الترويج
</button>
<p id="videoResult"></p>
</section>
<script>
function prepareVideo() {
  const url = document.getElementById("videoInput").value.trim();
  const result = document.getElementById("videoResult");

  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase();
    if (!["tiktok.com", "www.tiktok.com",
           "vt.tiktok.com", "vm.tiktok.com"].includes(host)
        || u.protocol !== "https:") {
      throw new Error("invalid");
    }
  } catch (e) {
    result.textContent = "❌ رابط تيك توك غير صحيح";
    return;
  }

  localStorage.setItem("promoVideo", url);
  result.replaceChildren();

  const msg = document.createElement("p");
  msg.textContent = "✅ تم تجهيز رابط الفيديو للمشاركة";
  result.appendChild(msg);

  const btn = document.createElement("button");
  btn.textContent = "مشاركة الفيديو";
  btn.onclick = async () => {
    if (navigator.share) {
      try { await navigator.share({url}); } catch(e) {}
    } else {
      await navigator.clipboard.writeText(url);
      alert("تم نسخ الرابط");
    }
  };
  result.appendChild(btn);
}
</script>
