<script>
async function shareVideo() {
 const url = "https://vt.tiktok.com/ZSp5M3Gyt/";
 if (navigator.share) {
   try {
     await navigator.share({title:"فيديو روحاني",url:url});
   } catch(e) {}
 } else {
   try {
     await navigator.clipboard.writeText(url);
     alert("تم نسخ رابط الفيديو");
   } catch(e) {
     prompt("انسخ رابط الفيديو:",url);
   }
 }
}
